<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .blk { fill: #f7f9fc; stroke: #37474f; stroke-width: 2; rx: 10; }
    .opt { fill: #fbfbfb; stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 7 5; }
    .title { font-size: 26px; font-weight: 700; fill: #263238; }
    .name { font-size: 19px; font-weight: 700; fill: #263238; }
    .sub { font-size: 13px; fill: #546e7a; }
    .pin { font-size: 14px; font-weight: 600; fill: #263238; }
    .lbl { font-size: 13px; fill: #37474f; }
    .note { font-size: 14px; fill: #37474f; }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .pwr { stroke: #d32f2f; } .gnd { stroke: #37474f; } .gsm { stroke: #1565c0; }
    .sen { stroke: #2e7d32; } .rs { stroke: #7b1fa2; } .ana { stroke: #ef6c00; } .tmp { stroke: #00838f; }
    .res { fill: #fff; stroke: #37474f; stroke-width: 2; }
    .dot { fill: #37474f; }
    .tagp { fill: #ffebee; stroke: #d32f2f; stroke-width: 1.5; }
    .tagg { fill: #eceff1; stroke: #37474f; stroke-width: 1.5; }
    .tagt { font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1600" height="1010" fill="#ffffff"/>
  <text x="40" y="48" class="title">EMS Water Level Station — Wiring</text>
  <text x="40" y="74" class="sub">Arduino Nano + SIM800L + DFRobot URM06-PULSE + TTL-to-RS485 (MAX485) · firmware: water_level_sensor.ino (10.7.1)</text>

  <!-- ===================== Arduino Nano ===================== -->
  <rect x="640" y="150" width="240" height="610" class="blk"/>
  <text x="760" y="185" text-anchor="middle" class="name">Arduino Nano</text>
  <text x="760" y="204" text-anchor="middle" class="sub">USB: Serial Monitor 9600</text>
  <!-- left pins -->
  <text x="652" y="235" class="pin">D8</text>
  <text x="652" y="295" class="pin">D9</text>
  <text x="652" y="625" class="pin">VIN</text>
  <text x="652" y="685" class="pin">GND</text>
  <!-- right pins -->
  <text x="868" y="235" text-anchor="end" class="pin">D2</text>
  <text x="868" y="295" text-anchor="end" class="pin">D3</text>
  <text x="868" y="385" text-anchor="end" class="pin">D7</text>
  <text x="868" y="505" text-anchor="end" class="pin">D0 (RX)</text>
  <text x="868" y="555" text-anchor="end" class="pin">D1 (TX)</text>
  <text x="868" y="605" text-anchor="end" class="pin">D4</text>
  <text x="868" y="655" text-anchor="end" class="pin">5V</text>
  <text x="868" y="705" text-anchor="end" class="pin">GND</text>
  <!-- bottom pin -->
  <text x="760" y="750" text-anchor="middle" class="pin">A0</text>

  <!-- ===================== SIM800L ===================== -->
  <rect x="180" y="170" width="220" height="200" class="blk"/>
  <text x="290" y="205" text-anchor="middle" class="name">SIM800L</text>
  <text x="270" y="224" text-anchor="middle" class="sub">GSM module</text>
  <text x="270" y="265" text-anchor="middle" class="sub">SIM: PIN lock off</text>
  <path d="M370 170 L370 120 M360 120 L380 120 M362 130 L378 130" class="w gnd"/>
  <text x="380" y="112" class="lbl">antenna</text>
  <text x="388" y="235" text-anchor="end" class="pin">TXD</text>
  <text x="388" y="295" text-anchor="end" class="pin">RXD</text>
  <text x="230" y="360" text-anchor="middle" class="pin">VCC</text>
  <text x="350" y="360" text-anchor="middle" class="pin">GND</text>
  <text x="290" y="332" text-anchor="middle" class="sub">(RST not used)</text>

  <!-- TXD -> D8 -->
  <path d="M400 230 L640 230" class="w gsm"/>
  <text x="520" y="220" text-anchor="middle" class="lbl">TXD → D8</text>
  <!-- D9 -> 1k -> node -> RXD ; node -> 2k -> GND -->
  <path d="M640 290 L590 290 M530 290 L400 290" class="w gsm"/>
  <rect x="530" y="281" width="60" height="18" class="res"/>
  <text x="560" y="274" text-anchor="middle" class="lbl">1 kΩ</text>
  <circle cx="470" cy="290" r="5" class="dot"/>
  <path d="M470 290 L470 312 M470 370 L470 392" class="w gnd"/>
  <rect x="461" y="312" width="18" height="58" class="res"/>
  <text x="453" y="346" text-anchor="end" class="lbl">2 kΩ</text>
  <path d="M452 392 L488 392 M458 400 L482 400 M464 408 L476 408" class="w gnd"/>
  <text x="560" y="318" text-anchor="middle" class="lbl">D9 → RXD</text>
  <text x="560" y="334" text-anchor="middle" class="sub">divider 5 V → 3.3 V</text>

  <!-- SIM800L power: buck converter + 1000uF -->
  <path d="M230 370 L230 470" class="w pwr"/>
  <path d="M350 370 L350 470" class="w gnd"/>
  <path d="M230 420 L283 420 M297 420 L350 420" class="w gnd"/>
  <path d="M283 404 L283 436" class="w pwr"/>
  <path d="M297 404 L297 436" class="w gnd"/>
  <text x="272" y="402" class="lbl">+</text>
  <text x="290" y="456" text-anchor="middle" class="lbl">1000 µF</text>
  <rect x="150" y="470" width="260" height="90" class="blk"/>
  <text x="280" y="500" text-anchor="middle" class="name">Buck converter</text>
  <text x="280" y="520" text-anchor="middle" class="sub">LM2596 / MP1584 · set OUT = 4.0 V, ≥ 2 A</text>
  <text x="280" y="542" text-anchor="middle" class="sub">OUT+ ↑ to VCC · OUT− ↑ to GND</text>
  <path d="M230 560 L230 610" class="w pwr"/>
  <path d="M350 560 L350 610" class="w gnd"/>
  <rect x="196" y="610" width="68" height="24" rx="12" class="tagp"/>
  <text x="230" y="627" text-anchor="middle" class="tagt" fill="#d32f2f">+12 V</text>
  <rect x="320" y="610" width="60" height="24" rx="12" class="tagg"/>
  <text x="350" y="627" text-anchor="middle" class="tagt" fill="#37474f">GND</text>
  <text x="280" y="652" text-anchor="middle" class="sub">IN+ / IN− from the 12 V supply</text>

  <!-- Nano power -->
  <path d="M640 620 L580 620" class="w pwr"/>
  <rect x="512" y="608" width="68" height="24" rx="12" class="tagp"/>
  <text x="546" y="625" text-anchor="middle" class="tagt" fill="#d32f2f">+12 V</text>
  <path d="M640 680 L580 680" class="w gnd"/>
  <rect x="520" y="668" width="60" height="24" rx="12" class="tagg"/>
  <text x="550" y="685" text-anchor="middle" class="tagt" fill="#37474f">GND</text>

  <!-- ===================== 12 V supply ===================== -->
  <rect x="150" y="760" width="260" height="110" class="blk"/>
  <text x="280" y="792" text-anchor="middle" class="name">12 V supply</text>
  <text x="280" y="812" text-anchor="middle" class="sub">adapter or battery, ≥ 3 A (6–12 V)</text>
  <text x="280" y="832" text-anchor="middle" class="sub">feeds: Nano VIN, URM06, buck converter</text>
  <path d="M230 760 L230 720" class="w pwr"/>
  <rect x="196" y="696" width="68" height="24" rx="12" class="tagp"/>
  <text x="230" y="713" text-anchor="middle" class="tagt" fill="#d32f2f">+12 V</text>
  <path d="M350 760 L350 720" class="w gnd"/>
  <rect x="320" y="696" width="60" height="24" rx="12" class="tagg"/>
  <text x="350" y="713" text-anchor="middle" class="tagt" fill="#37474f">GND</text>
  <text x="290" y="858" text-anchor="middle" class="sub">+ / − terminals</text>

  <!-- ===================== URM06-PULSE ===================== -->
  <rect x="1100" y="150" width="240" height="170" class="blk"/>
  <text x="1220" y="200" text-anchor="middle" class="name">URM06-PULSE</text>
  <text x="1220" y="219" text-anchor="middle" class="sub">DFRobot SEN0151 · 20 cm – 10 m</text>
  <circle cx="1300" cy="275" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="1300" cy="275" r="10" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="1112" y="235" class="pin">Trig</text>
  <text x="1112" y="295" class="pin">Echo</text>
  <text x="1160" y="170" text-anchor="middle" class="pin">VCC</text>
  <text x="1280" y="170" text-anchor="middle" class="pin">GND</text>
  <text x="1220" y="345" text-anchor="middle" class="sub">point straight down at the water, ≥ 20 cm above max level</text>
  <path d="M880 230 L1100 230" class="w sen"/>
  <text x="990" y="220" text-anchor="middle" class="lbl">D2 → Trig</text>
  <path d="M880 290 L1100 290" class="w sen"/>
  <text x="990" y="280" text-anchor="middle" class="lbl">Echo → D3</text>
  <!-- URM06 power + 470uF -->
  <path d="M1160 150 L1160 105" class="w pwr"/>
  <path d="M1280 150 L1280 105" class="w gnd"/>
  <path d="M1160 128 L1213 128 M1227 128 L1280 128" class="w gnd"/>
  <path d="M1213 114 L1213 142" class="w pwr"/>
  <path d="M1227 114 L1227 142" class="w gnd"/>
  <text x="1220" y="108" text-anchor="middle" class="lbl">470 µF</text>
  <rect x="1126" y="81" width="68" height="24" rx="12" class="tagp"/>
  <text x="1160" y="98" text-anchor="middle" class="tagt" fill="#d32f2f">+12 V</text>
  <rect x="1250" y="81" width="60" height="24" rx="12" class="tagg"/>
  <text x="1280" y="98" text-anchor="middle" class="tagt" fill="#37474f">GND</text>

  <!-- ===================== DS18B20 (optional) ===================== -->
  <rect x="1100" y="360" width="240" height="66" rx="10" class="opt"/>
  <text x="1220" y="386" text-anchor="middle" class="name" font-size="16">DS18B20 (optional)</text>
  <text x="1220" y="406" text-anchor="middle" class="sub">DATA + 4.7 kΩ pull-up to +5 V · USE_DS18B20 1</text>
  <path d="M880 380 L1100 380" class="w tmp" stroke-dasharray="8 6"/>
  <text x="990" y="370" text-anchor="middle" class="lbl">D7 ↔ DATA</text>

  <!-- ===================== MAX485 ===================== -->
  <rect x="1100" y="470" width="240" height="260" class="blk"/>
  <text x="1220" y="455" text-anchor="middle" class="name">TTL-to-RS485 (MAX485)</text>
  <text x="1112" y="505" class="pin">RO</text>
  <text x="1112" y="555" class="pin">DI</text>
  <text x="1112" y="595" class="pin">DE</text>
  <text x="1112" y="625" class="pin">RE</text>
  <text x="1112" y="655" class="pin">VCC</text>
  <text x="1112" y="705" class="pin">GND</text>
  <text x="1328" y="565" text-anchor="end" class="pin">A</text>
  <text x="1328" y="645" text-anchor="end" class="pin">B</text>
  <path d="M1100 500 L880 500" class="w rs"/>
  <text x="990" y="490" text-anchor="middle" class="lbl">RO → D0</text>
  <path d="M880 550 L1100 550" class="w rs"/>
  <text x="990" y="540" text-anchor="middle" class="lbl">D1 → DI</text>
  <path d="M880 600 L1060 600 M1060 590 L1100 590 M1060 620 L1100 620 M1060 590 L1060 620" class="w rs"/>
  <circle cx="1060" cy="600" r="5" class="dot"/>
  <text x="975" y="590" text-anchor="middle" class="lbl">D4 → DE + RE</text>
  <path d="M880 650 L1100 650" class="w pwr"/>
  <text x="990" y="642" text-anchor="middle" class="lbl">5V → VCC</text>
  <path d="M880 700 L1100 700" class="w gnd"/>
  <text x="990" y="692" text-anchor="middle" class="lbl">GND</text>

  <!-- RS485 bus to converter with 120 ohm -->
  <path d="M1340 560 L1440 560" class="w rs"/>
  <path d="M1340 640 L1440 640" class="w rs"/>
  <circle cx="1380" cy="560" r="5" class="dot"/>
  <circle cx="1380" cy="640" r="5" class="dot"/>
  <rect x="1371" y="572" width="18" height="56" class="res"/>
  <path d="M1380 560 L1380 572 M1380 628 L1380 640" class="w gnd"/>
  <text x="1396" y="600" class="lbl">120 Ω</text>
  <text x="1390" y="680" text-anchor="middle" class="sub">at each bus end</text>
  <rect x="1440" y="500" width="140" height="200" class="blk"/>
  <text x="1510" y="530" text-anchor="middle" class="name" font-size="16">RS485-to-LAN</text>
  <text x="1452" y="565" class="pin">A</text>
  <text x="1452" y="645" class="pin">B</text>
  <text x="1510" y="592" text-anchor="middle" class="sub">TCP server</text>
  <text x="1510" y="608" text-anchor="middle" class="sub">transparent</text>
  <text x="1510" y="624" text-anchor="middle" class="sub">port 8899</text>
  <text x="1510" y="680" text-anchor="middle" class="sub">9600 8N1</text>
  <path d="M1510 700 L1510 750" class="w gsm"/>
  <path d="M1500 740 L1510 752 L1520 740" class="w gsm"/>
  <text x="1510" y="772" text-anchor="middle" class="lbl">LAN → EMS server</text>

  <!-- ===================== Battery sense ===================== -->
  <path d="M760 760 L760 820" class="w ana"/>
  <circle cx="760" cy="820" r="5" class="dot"/>
  <path d="M760 820 L720 820 M660 820 L620 820" class="w ana"/>
  <rect x="660" y="811" width="60" height="18" class="res"/>
  <text x="690" y="804" text-anchor="middle" class="lbl">100 kΩ</text>
  <rect x="552" y="808" width="68" height="24" rx="12" class="tagp"/>
  <text x="586" y="825" text-anchor="middle" class="tagt" fill="#d32f2f">+12 V</text>
  <path d="M760 820 L800 820 M860 820 L900 820" class="w gnd"/>
  <rect x="800" y="811" width="60" height="18" class="res"/>
  <text x="830" y="804" text-anchor="middle" class="lbl">100 kΩ</text>
  <rect x="900" y="808" width="60" height="24" rx="12" class="tagg"/>
  <text x="930" y="825" text-anchor="middle" class="tagt" fill="#37474f">GND</text>
  <text x="760" y="858" text-anchor="middle" class="lbl">Battery sense on A0 (BATTERY_DIVIDER 2.0) — max 10 V with 100k/100k.</text>
  <text x="760" y="876" text-anchor="middle" class="lbl">For a 12 V battery use 200 kΩ (top) + 100 kΩ and set BATTERY_DIVIDER 3.0.</text>

  <!-- ===================== Notes + legend ===================== -->
  <rect x="40" y="900" width="1520" height="96" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="60" y="926" class="note">• All GNDs connected together; run the SIM800L GND straight back to the supply.   • Never power the SIM800L from the Nano 5V pin.</text>
  <text x="60" y="948" class="note">• Unplug the RS485 RO wire (D0) while uploading — D0/D1 are also the Nano's USB serial.   • Same pins on the SMS gateway Nano: SIM800L D8/D9 (RST → D4 optional), USB to the server.</text>
  <g font-size="13" font-weight="600">
    <line x1="60" y1="974" x2="90" y2="974" class="w pwr"/><text x="96" y="978" fill="#37474f">power</text>
    <line x1="160" y1="974" x2="190" y2="974" class="w gnd"/><text x="196" y="978" fill="#37474f">ground</text>
    <line x1="270" y1="974" x2="300" y2="974" class="w gsm"/><text x="306" y="978" fill="#37474f">GSM / LAN</text>
    <line x1="400" y1="974" x2="430" y2="974" class="w sen"/><text x="436" y="978" fill="#37474f">ultrasonic</text>
    <line x1="530" y1="974" x2="560" y2="974" class="w rs"/><text x="566" y="978" fill="#37474f">RS485 / Modbus</text>
    <line x1="690" y1="974" x2="720" y2="974" class="w ana"/><text x="726" y="978" fill="#37474f">battery sense</text>
    <line x1="840" y1="974" x2="870" y2="974" class="w tmp" stroke-dasharray="8 6"/><text x="876" y="978" fill="#37474f">optional</text>
  </g>
</svg>
